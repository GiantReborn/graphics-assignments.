<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Graphics Assignments</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#eef4ff;font:16px Arial,sans-serif}
header{text-align:center;padding:28px 16px 12px}h1{margin:0 0 8px;font-size:clamp(24px,5vw,38px)}header p{color:#b9c7dc;margin:0}
main{max-width:1000px;margin:20px auto;padding:0 16px;display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:#1c2a40;border:1px solid #34445e;border-radius:14px;padding:14px}
h2{font-size:19px;margin:0 0 10px}.stage{height:190px;background:#0a1322;border-radius:9px;position:relative;overflow:hidden}
.ball{position:absolute;width:24px;height:24px;border-radius:50%;background:#ffca55;animation:bounce 2.1s linear infinite alternate}
@keyframes bounce{0%{left:5%;top:5%}25%{left:75%;top:5%}50%{left:75%;top:80%}75%{left:5%;top:80%}100%{left:5%;top:5%}}
.road{position:absolute;bottom:26px;height:3px;background:#718096;width:100%}
.car{position:absolute;bottom:34px;left:-100px;width:82px;height:32px;background:#e75b55;border-radius:12px 18px 5px 5px;animation:drive 5s linear infinite}
.car:before{content:"";position:absolute;left:18px;top:-16px;width:42px;height:19px;background:#e75b55;border-radius:10px 12px 0 0}
.car:after{content:"";position:absolute;left:13px;bottom:-7px;width:14px;height:14px;background:#101827;border:3px solid #cbd5e1;border-radius:50%;box-shadow:44px 0 0 -3px #101827,44px 0 0 0 #cbd5e1}
@keyframes drive{to{left:110%}}
.night{background:linear-gradient(#07132e,#172c4c)}
.moon{position:absolute;width:70px;height:70px;border-radius:50%;background:#f4edcf;right:-80px;top:35px;box-shadow:0 0 28px #f4edcf88;animation:moon 8s linear infinite}
@keyframes moon{to{right:calc(100% + 80px)}}
.star{position:absolute;width:3px;height:3px;background:white;border-radius:50%;animation:twinkle 1.5s infinite alternate}
@keyframes twinkle{to{opacity:.25}}
.note{font-size:13px;color:#b9c7dc;margin-top:9px}
</style>
</head>
<body>
<header><h1>My Graphics Assignments</h1><p>Computer Graphics · Animation demonstrations</p></header>
<main>
<section class="card"><h2>1. Bouncing Ball</h2><div class="stage"><div class="ball"></div></div><div class="note">A ball bounces within the screen boundaries.</div></section>
<section class="card"><h2>2. Moving Car</h2><div class="stage"><div class="road"></div><div class="car"></div></div><div class="note">A car travels across the screen and reappears.</div></section>
<section class="card"><h2>3. Moving Moon</h2><div class="stage night"><div class="moon"></div>
<div class="star" style="left:12%;top:20%"></div><div class="star" style="left:28%;top:48%"></div><div class="star" style="left:43%;top:16%"></div><div class="star" style="left:61%;top:34%"></div><div class="star" style="left:82%;top:18%"></div><div class="star" style="left:91%;top:58%"></div><div class="star" style="left:70%;top:72%"></div><div class="star" style="left:20%;top:78%"></div></div><div class="note">A full moon moves across a starry night sky.</div></section>
</main>
</body></html>
